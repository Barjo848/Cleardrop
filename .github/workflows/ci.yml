name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    # Apple Silicon (arm64) runner. Intel is not built or tested.
    runs-on: macos-15
    env:
      # The interop tests need real third-party tools. Here a missing tool is a failure.
      CLEARDROP_REQUIRE_INTEROP: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          uname -m
          sw_vers
          swiftc --version
      - name: Install interop tools (qpdf, pdfTeX)
        run: |
          brew install qpdf
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - name: Test
        run: ./scripts/run_tests.sh
      - name: Build
        run: ./scripts/build.sh
